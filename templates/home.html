<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#0d1117;
            overflow:hidden;
            position:relative;
        }

        /* Animated Background */

        body::before{
            content:"";
            position:absolute;
            width:450px;
            height:450px;
            background:#2563eb;
            border-radius:50%;
            filter:blur(170px);
            top:-120px;
            left:-120px;
            opacity:.35;
        }

        body::after{
            content:"";
            position:absolute;
            width:400px;
            height:400px;
            background:#9333ea;
            border-radius:50%;
            filter:blur(170px);
            bottom:-100px;
            right:-100px;
            opacity:.35;
        }

        .card{
            position:relative;
            z-index:2;
            width:100%;
            max-width:700px;
            background:rgba(22,27,34,.9);
            border:1px solid rgba(255,255,255,.08);
            border-radius:20px;
            backdrop-filter:blur(15px);
            box-shadow:0 15px 45px rgba(0,0,0,.5);
            padding:35px;
        }

        h2{
            text-align:center;
            color:white;
            margin-bottom:30px;
            font-weight:700;
        }

        .form-label{
            color:#d1d5db;
            font-weight:500;
        }

        .form-control,
        .form-select{
            background:#0f172a;
            color:white;
            border:1px solid #334155;
            border-radius:10px;
            padding:12px;
        }

        .form-control:focus,
        .form-select:focus{
            background:#0f172a;
            color:white;
            border-color:#3b82f6;
            box-shadow:0 0 12px rgba(59,130,246,.5);
        }

        .form-control::placeholder{
            color:#94a3b8;
        }

        .btn-custom{
            width:100%;
            background:linear-gradient(90deg,#2563eb,#7c3aed);
            color:white;
            border:none;
            padding:14px;
            border-radius:12px;
            font-size:18px;
            font-weight:600;
            transition:.3s;
        }

        .btn-custom:hover{
            transform:translateY(-2px);
            box-shadow:0 0 20px rgba(59,130,246,.6);
        }

        .result{
            margin-top:25px;
            padding:18px;
            text-align:center;
            background:#111827;
            border:1px solid #3b82f6;
            border-radius:12px;
            color:#60a5fa;
            font-size:26px;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="card">

<h2>Student Performance Prediction</h2>

<form action="{{ url_for('predict_datapoint') }}" method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Gender</label>

<select class="form-select" name="gender" required>

<option selected disabled>Select Gender</option>

<option value="male">Male</option>

<option value="female">Female</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Race / Ethnicity</label>

<select class="form-select" name="ethnicity" required>

<option selected disabled>Select Group</option>

<option value="group A">Group A</option>

<option value="group B">Group B</option>

<option value="group C">Group C</option>

<option value="group D">Group D</option>

<option value="group E">Group E</option>

</select>

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Parent Education</label>

<select class="form-select" name="parental_level_of_education" required>

<option selected disabled>Select Education</option>

<option value="associate's degree">Associate's Degree</option>

<option value="bachelor's degree">Bachelor's Degree</option>

<option value="master's degree">Master's Degree</option>

<option value="high school">High School</option>

<option value="some college">Some College</option>

<option value="some high school">Some High School</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Lunch Type</label>

<select class="form-select" name="lunch" required>

<option selected disabled>Select Lunch</option>

<option value="standard">Standard</option>

<option value="free/reduced">Free / Reduced</option>

</select>

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Test Preparation</label>

<select class="form-select" name="test_preparation_course" required>

<option selected disabled>Select Course</option>

<option value="completed">Completed</option>

<option value="none">None</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Reading Score</label>

<input
type="number"
class="form-control"
name="reading_score"
placeholder="Enter Reading Score"
min="0"
max="100"
required>

</div>

</div>

<div class="mb-4">

<label class="form-label">Writing Score</label>

<input
type="number"
class="form-control"
name="writing_score"
placeholder="Enter Writing Score"
min="0"
max="100"
required>

</div>

<button class="btn btn-custom">

Predict Mathematics Score

</button>

</form>

{% if results %}

<div class="result">

Predicted Mathematics Score

<br><br>

{{ results }}

</div>

{% endif %}

</div>

</body>

</html>
